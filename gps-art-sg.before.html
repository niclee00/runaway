function svg(outline, route) {
  const all = outline.concat(route), k = Math.cos(all[0][0] * Math.PI / 180);
  const xy = ([a, b]) => [b * k, -a];
  const p = all.map(xy), xs = p.map(q => q[0]), ys = p.map(q => q[1]);
  const mx = Math.min(...xs), my = Math.min(...ys), s = Math.max(Math.max(...xs) - mx, Math.max(...ys) - my) || 1;
  const d = l => l.map(xy).map(([x, y], i) => (i ? 'L' : 'M') + ((x - mx) / s * 180 + 10).toFixed(1) + ' ' + ((y - my) / s * 180 + 10).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 200 200"><path d="${d(outline)}" fill="none" stroke="var(--ghost)" stroke-width="1.6" stroke-dasharray="4 3"/><path d="${d(route)}" fill="none" stroke="var(--lime)" stroke-width="2" stroke-linejoin="round"/></svg>`;
